name: light_memory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  audioplayers: ^6.8.1
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 確保正確宣告靜態資源與所有子資料夾
  assets:
    - assets/images/
    - assets/audio/
    - assets/images/game/market_shopping/
    - assets/images/game/fridge_inventory/