name: light_memory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  audioplayers: ^6.8.1

  flutter_tts: ^4.2.0
  share_plus: ^10.1.4
  http_parser: ^4.0.2

  fl_chart: ^0.69.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  record: ^7.1.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  table_calendar: ^3.2.1
  flutter_animate: ^4.5.2
  visibility_detector: ^0.4.0+2
  path_provider: 2.1.6
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 確保正確宣告靜態資源與所有子資料夾
  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/game/
    - assets/images/game/market_shopping/
    - assets/images/game/cooking_prep/
    - assets/images/game/market_sort/
    - assets/images/game/fridge_inventory/
    - assets/images/abilities/
    - assets/images/shop/